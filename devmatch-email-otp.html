<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login dengan OTP — DEV-MATCH</title>
<link rel="stylesheet" href="assets/css/auth.css">
<style>body{display:block}.otp-box{width:min(100% - 40px,440px);margin:60px auto;padding:24px 0}.otp-box h1{margin-top:36px}.otp-box label{display:block;margin-bottom:8px}.otp-box input{width:100%;min-width:0}.otp-box .in{margin-bottom:20px}.otp-box button{cursor:pointer}.otp-actions{display:flex;gap:20px;margin-top:20px}.otp-actions button{border:0;background:none;text-decoration:underline;font:inherit}.otp-box [hidden]{display:none!important}#otpStatus{line-height:1.7;margin:20px 0}#otpCode{letter-spacing:.35em;font-size:22px}</style>
<script src="assets/vendor/supabase-2.119.0.js"></script><script src="assets/js/backend.js?v=20261112-private-profile-cache"></script></head>
<body><main class="otp-box"><a class="logo" href="devmatch-landing.html"><i>&lt;/&gt;</i>DEV-MATCH</a>
<h1>Login dengan kode email</h1><p class="sub">Gunakan email yang sudah terdaftar. Masukkan kode sekali pakai untuk masuk.</p>
<form id="otpEmailForm"><label for="otpEmail">Email</label><div class="in"><input id="otpEmail" type="email" autocomplete="email" placeholder="nama@email.com" required></div><button class="submit" id="otpSend">Kirim kode login</button></form>
<form id="otpCodeForm" hidden><label for="otpCode">Kode dari email</label><div class="in"><input id="otpCode" type="text" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6,10}" maxlength="10" required></div><button class="submit" id="otpVerify">Verifikasi dan masuk</button>
<div class="otp-actions"><button id="otpResend" type="button">Kirim ulang</button><button id="otpChange" type="button">Ganti email</button></div></form>
<p id="otpStatus" role="status" aria-live="polite"></p><a href="devmatch-auth.html?mode=login">Login dengan password</a></main><script src="assets/js/email-otp.js?v=20261112-private-profile-cache"></script></body></html>
