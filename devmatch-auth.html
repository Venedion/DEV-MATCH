<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Create your account — DEV-MATCH</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/auth.css">
</head>
<body>
<div class="page">
  <aside class="side">
    <a class="logo" href="devmatch-landing.html"><i>&lt;/&gt;</i>DEV-MATCH</a>
    <div>
      <span class="badge" id="sideBadge"></span>
      <h2 id="sideTitle"></h2>
    </div>
    <figure class="quote">
      <p id="qText"></p>
      <div class="who"><span class="av" id="qAv"></span><div><b id="qName"></b><span id="qRole"></span></div></div>
    </figure>
  </aside>

  <main class="main"><div class="box">
    <a class="back" href="devmatch-landing.html#join"><svg viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>Back to role selection</a>

    <div class="roleline" id="roleline">
      <span class="tag" id="roleTag"></span>
      <span id="switchWrap"></span>
    </div>

    <h1 id="title"></h1>
    <p class="sub" id="sub"></p>

    <form id="form" novalidate>
      <div class="f reg">
        <label for="user">Username</label>
        <div class="in" id="g-user"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg><input id="user" autocomplete="username" placeholder="yourname" maxlength="24"></div>
        <p class="hint" id="userHint"></p><p class="msg" id="e-user" role="alert"></p>
      </div>
      <div class="f">
        <label for="email" id="emailLabel">Email</label>
        <div class="in" id="g-email"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg><input id="email" type="email" autocomplete="email" placeholder="you@example.com"></div>
        <p class="msg" id="e-email" role="alert"></p>
      </div>
      <div class="f reg">
        <label for="phone">Phone number</label>
        <div class="in" id="g-phone"><span class="pre"><span class="flag"></span>+62</span><input id="phone" type="tel" inputmode="numeric" autocomplete="tel-national" placeholder="812 3456 7890"></div>
        <p class="hint">Used for WhatsApp contact</p><p class="msg" id="e-phone" role="alert"></p>
      </div>
      <div class="f">
        <label for="pass">Password<a class="forgot log hide" href="#">Forgot password?</a></label>
        <div class="in" id="g-pass"><svg viewBox="0 0 24 24"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg><input id="pass" type="password" autocomplete="new-password" placeholder="At least 8 characters"><button type="button" class="eye" id="eye" aria-label="Show password"><svg viewBox="0 0 24 24"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button></div>
        <div class="reg"><div class="meter" id="meter"><i></i><i></i><i></i><i></i></div><p id="strength"></p></div>
        <p class="msg" id="e-pass" role="alert"></p>
      </div>
      <div class="check reg"><input type="checkbox" id="terms"><label for="terms">I agree to the <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a></label></div>
      <p class="msg reg" id="e-terms" role="alert" style="margin:-14px 0 14px"></p>
      <button class="submit" id="submit" type="submit"></button>
    </form>

    <p class="alt" id="alt"></p>
  </div></main>
</div>

<script src="assets/js/auth.js"></script>
</body>
</html>
